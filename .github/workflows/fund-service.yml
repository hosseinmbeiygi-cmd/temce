# ── Fund Service CI ─────────────────────────────────────────────
# Runs migration + fund-specific tests on push/PR to main/develop
# that touch fund-related code.
#
# Jobs:
#   1. migrate — runs alembic upgrade head on ephemeral PostgreSQL
#   2. fund-tests — runs fund unit + API integration tests
#
# This workflow is separate from the main CI (ci.yml) so fund
# changes can be validated independently and faster.

name: Fund Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "**/*.py"
      - services/fund_service.py
      - services/fund_*.py
      - repositories/fund_repository.py
      - domain/funds/**
      - models/fund.py
      - apps/api/endpoints/funds.py
      - tests/unit/test_funds_api.py
      - tests/unit/services/test_fund_service.py
      - migrations/versions/*fund*.py
      - migrations/env.py
      - requirements*.txt
      - pyproject.toml
      - docs/**
      - scripts/check_mermaid_blocks.py
      - scripts/check_mermaid_syntax.cjs
      - .github/workflows/fund-service.yml
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - services/fund_service.py
      - services/fund_*.py
      - repositories/fund_repository.py
      - domain/funds/**
      - models/fund.py
      - apps/api/endpoints/funds.py
      - tests/unit/test_funds_api.py
      - tests/unit/services/test_fund_service.py
      - migrations/versions/*fund*.py
      - migrations/env.py
      - requirements*.txt
      - pyproject.toml
      - docs/**
      - scripts/check_mermaid_blocks.py
      - scripts/check_mermaid_syntax.cjs
      - .github/workflows/fund-service.yml

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Migration Runner ────────────────────────────────────────
  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fund_test
          POSTGRES_USER: fund_user
          POSTGRES_PASSWORD: fund_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ env.PYTHON_VERSION }}-fund-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            pip-${{ env.PYTHON_VERSION }}-fund-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alembic migrations (upgrade head)
        run: alembic upgrade head --raiseerr
        env:
          DATABASE_URL: postgresql://fund_user:fund_pass@localhost:5432/fund_test
          ENV: test

      - name: Verify migration state
        run: alembic current
        env:
          DATABASE_URL: postgresql://fund_user:fund_pass@localhost:5432/fund_test
          ENV: test

      - name: List all database tables
        run: |
          psql -h localhost -U fund_user -d fund_test -c \
            "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name;"
        env:
          PGPASSWORD: fund_pass

  # ── Fund Tests ──────────────────────────────────────────────
  fund-tests:
    name: Fund Service Tests
    runs-on: ubuntu-latest
    needs: [migrate]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fund_test
          POSTGRES_USER: fund_user
          POSTGRES_PASSWORD: fund_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node.js (for frontend tests)
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ env.PYTHON_VERSION }}-fund-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            pip-${{ env.PYTHON_VERSION }}-fund-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio pytest-cov pytest-timeout

      - name: Run alembic migrations (setup DB for tests)
        run: alembic upgrade head --raiseerr
        env:
          DATABASE_URL: postgresql://fund_user:fund_pass@localhost:5432/fund_test
          ENV: test

      - name: Run FundService unit tests
        run: |
          pytest tests/unit/services/test_fund_service.py \
            --cov=services/fund_service.py \
            --cov=repositories/fund_repository.py \
            --cov=domain/funds \
            --cov-report=term \
            --cov-report=xml:coverage-fund-service.xml \
            --timeout=60 \
            -v
        env:
          DATABASE_URL: postgresql://fund_user:fund_pass@localhost:5432/fund_test
          REDIS_URL: redis://localhost:6379/0
          ENV: test

      - name: Run Fund API integration tests
        run: |
          pytest tests/unit/test_funds_api.py \
            --cov=apps/api/endpoints/funds.py \
            --cov=services/fund_service.py \
            --cov-report=term \
            --cov-report=xml:coverage-fund-api.xml \
            --timeout=60 \
            -v
        env:
          DATABASE_URL: postgresql://fund_user:fund_pass@localhost:5432/fund_test
          REDIS_URL: redis://localhost:6379/0
          ENV: test

      - name: Upload FundService coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fund-service
          path: coverage-fund-service.xml
          if-no-files-found: warn

      - name: Upload Fund API coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fund-api
          path: coverage-fund-api.xml
          if-no-files-found: warn

      - name: Upload consolidated coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage-fund-service.xml,coverage-fund-api.xml
          fail_ci_if_error: false
          flags: fund-service

      - name: Run frontend fund-analysis tests
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npx vitest run src/__tests__/fund-analysis.test.ts --reporter=verbose
        continue-on-error: true

  # ── Mermaid docs syntax check ─────────────────────────────
  docs:
    name: Mermaid Syntax (docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install jsdom (for mermaid.parse sandbox)
        run: npm i -D jsdom@29.1.1 --no-save --no-package-lock --no-audit --no-fund

      - name: Check Mermaid diagram syntax
        run: python scripts/check_mermaid_blocks.py
