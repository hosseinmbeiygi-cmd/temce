# ── Continuous Integration ──────────────────────────────────────
# Runs on push/PR to main/develop when relevant files change.
# - Lint & typecheck Python + Node.js
# - Run backend tests (with PostgreSQL + Redis services)
# - Build & push Docker images (main only)
# - Scan images for vulnerabilities (main only)

name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "frontend/src/**/*.ts"
      - "frontend/src/**/*.tsx"
      - "frontend/src/**/*.js"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/tsconfig.json"
      - "frontend/next.config.*"
      - "frontend/eslint.config.mjs"
      - "Dockerfile*"
      - "docker-compose*.yml"
      - "docs/**"
      - "scripts/check_mermaid_blocks.py"
      - "scripts/check_mermaid_syntax.cjs"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "frontend/src/**/*.ts"
      - "frontend/src/**/*.tsx"
      - "frontend/src/**/*.js"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/tsconfig.json"
      - "frontend/next.config.*"
      - "frontend/eslint.config.mjs"
      - "Dockerfile*"
      - "docker-compose*.yml"
      - "docs/**"
      - "scripts/check_mermaid_blocks.py"
      - "scripts/check_mermaid_syntax.cjs"
      - ".github/workflows/ci.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ── Lint & Typecheck ──────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            pip-${{ env.PYTHON_VERSION }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy -r requirements.txt -r requirements-dev.txt

      - name: Lint Python with ruff
        run: ruff check . --output-format=github

      - name: Import contracts (advisory — Phase 0, ADR-0001)
        run: lint-imports --config .importlinter || echo "::warning::import contract violations present (baseline tracked in ADR-0001); hard-fail lands in Phase 1"

      - name: Typecheck Python with mypy
        run: mypy apps core domain services --ignore-missing-imports || true

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.api
          failure-threshold: warning

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.frontend
          failure-threshold: warning

      - name: Lint Worker Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.worker
          failure-threshold: warning

      - name: Lint Admin Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.admin
          failure-threshold: warning

      - name: Lint Scheduler Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.scheduler
          failure-threshold: warning

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: npm-${{ env.NODE_VERSION }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ env.NODE_VERSION }}-

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Typecheck TypeScript (tsc --noEmit)
        run: cd frontend && npx tsc --noEmit

  # ── Mermaid docs syntax check ─────────────────────────────
  docs:
    name: Mermaid Syntax (docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install jsdom (for mermaid.parse sandbox)
        run: npm i -D jsdom@29.1.1 --no-save --no-package-lock --no-audit --no-fund

      - name: Check Mermaid diagram syntax
        run: python scripts/check_mermaid_blocks.py

      - name: Production config gate (prod-check)
        run: ENV=production SECRET_KEY=ci-test-key-with-32-chars-minimum-xxxx CORS_ORIGINS='["https://example.com"]' DATABASE_URL=postgresql://market:market@localhost:5432/market_test AUTH_COOKIE_SECURE=true OTLP_ENDPOINT=http://otel:4318 python -c "from core.config import settings; settings.environment='production'; settings.validate_production(); print('prod-check OK')"

  # ── Backend Tests ─────────────────────────────────────────
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: market_test
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio pytest-cov pytest-timeout

      - name: Backtest integrity guard (cost parity + engine runner D1)
        run: |
          pytest tests/unit/backtesting/test_cost_parity.py tests/unit/backtesting/test_engine_runner.py -v -x
        env:
          DATABASE_URL: postgresql://market:market@localhost:5432/market_test
          REDIS_URL: redis://localhost:6379/0
          ENV: test

      - name: Run unit tests
        run: |
          pytest tests/unit \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --timeout=60 \
            -x -v
        env:
          DATABASE_URL: postgresql://market:market@localhost:5432/market_test
          REDIS_URL: redis://localhost:6379/0
          ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      # Real-broker Celery chain (precompute pipeline). Skips automatically
      # when the Redis service is unreachable; requires the celery package
      # from requirements.txt and spawns a real worker subprocess (solo pool).
      - name: Celery chain integration (real broker)
        run: |
          pytest tests/integration/test_celery_chain_broker.py \
            --timeout=300 \
            -v
        env:
          REDIS_URL: redis://localhost:6379/0
          ENV: test

  # ── Docker Build & Push (main only) ───────────────────────
  build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    strategy:
      matrix:
        service:
          - name: api
            dockerfile: Dockerfile.api
          - name: frontend
            dockerfile: Dockerfile.frontend
          - name: worker
            dockerfile: Dockerfile.worker
          - name: admin
            dockerfile: Dockerfile.admin
          - name: scheduler
            dockerfile: Dockerfile.scheduler

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=${{ matrix.service.name }}
            org.opencontainers.image.description=Iran Market Platform - ${{ matrix.service.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}:${{ github.sha }}
          format: sarif
          output: trivy-results-${{ matrix.service.name }}.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-${{ matrix.service.name }}.sarif
          category: trivy-${{ matrix.service.name }}
