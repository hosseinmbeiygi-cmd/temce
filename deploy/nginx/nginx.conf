# nginx reverse proxy — single entry point for the platform.
#
#   /api/v1/*          → backend (FastAPI, port 8000)
#   /api/v1/ws         → backend WebSocket
#   /metrics           → backend Prometheus metrics
#   everything else    → frontend (Next.js, port 3000)
#
# Usage (docker-compose.production.yml adds this service):
#   nginx:1.27-alpine, config mounted at /etc/nginx/conf.d/default.conf
#
# The production stack names the API service "api"; the local compose file
# calls it "backend". Keep them in sync if you rename the service.

upstream backend_upstream {
    server api:8000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ── Global security headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Only meaningful over TLS; browsers ignore it on plain HTTP, so it is
    # safe to set unconditionally for the TLS deployment.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Request size & timeouts ──
    client_max_body_size 25m;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    # ── API → backend ──
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ── WebSocket (realtime quotes) ──
    location /api/v1/ws {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ── Prometheus metrics → backend ──
    location = /metrics {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Health check passthrough ──
    location = /healthz {
        access_log off;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    # ── Everything else → frontend ──
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
