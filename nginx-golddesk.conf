# ── nginx config snippet for GoldDesk ─────────────────────────────────────
# I1 — دو ایراد واقعی در این فایل بود:
#
#   ۱) مسیرها `/api/gold/…` بودند، درحالی‌که surface واقعی طلا زیر
#      `/api/v1/gold` نصب شده (`apps/api/router.py:287-297` + همان چیزی که
#      فرانت در `frontend/src/lib/api.ts:1` و صفحهٔ /gold/tokens مستند می‌کند:
#      `http://localhost:8000/api/v1/gold/snapshot`). یعنی هیچ‌کدام از این
#      location ها با درخواست‌های واقعی مچ نمی‌شد.
#   ۲) هیچ log_format تعریف‌شده‌ای نبود، پس لاگ پیش‌فرض کل `$request` را
#      می‌نویسد — و `/api/v1/gold/ws?token=<JWT>` یعنی توکن دسترسی کاربر روی
#      دیسک در فایل access_log. handshak WebSocket نمی‌تواند هدر Authorization
#      بفرستد، پس توکن عمداً در query می‌آید (`src/gold_desk/api.py:691-708`).
#
# نحوهٔ ماسک: به‌جای `$request` (که query string را هم دارد) از `$uri` استفاده
# می‌کنیم — path نرمال‌شده بدون query. برای /ws یک access_log جدا با همین
# فرمت بسته‌بندی شده تا هیچ جا توکن نوشته نشود.

# ══ http block (once, in nginx.conf — not inside server) ══════════════════
#
# log_format golddesk_masked '$remote_addr - $remote_user [$time_local] '
#                            '"$request_method $uri $server_protocol" '
#                            '$status $body_bytes_sent '
#                            '"$http_referer" "$http_user_agent"';
#
# ══ server block ══════════════════════════════════════════════════════════

# /api/v1/gold/* → backend (شامل /snapshot، /score، /hot، /portfolio، …)
location /api/v1/gold/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # پاسخ‌های مالی نباید در cache وسط مسیر بنشینند؛ PWA خودش TTL را مدیریت می‌کند.
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}

# /api/v1/gold/ws → backend (WebSocket)
#
# `location` با پیشوند /api/v1/gold/ بالاتر هم این را می‌گیرد، ولی upgrade
# نیاز به Connection: upgrade دارد، پس یک بلاک صریح و طولانی‌تر نگه داشته می‌شود.
location = /api/v1/gold/ws {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # I1: لاگ این مسیر با فرمت ماسک‌شده — توکن در query string است.
    # (فرمت بالا در http block تعریف شده باشد.)
    access_log /var/log/nginx/golddesk-ws.access.log golddesk_masked;

    # سوکت باید زنده بماند: ping فرانت هر ۳۰ ثانیه می‌رود، پس read timeout
    # باید بیشتر از آن باشد وگرنه هر ۳۰ ثانیه یک‌بار disconnect می‌شود.
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_buffering off;
    proxy_cache off;
}

# /gold/* → frontend
location /gold/ {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Service worker و manifest — نباید کش شوند وگرنه نسخهٔ TTL جدید دیر فعال می‌شود.
location = /golddesk-sw.js {
    proxy_pass http://frontend:3000;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
