# صندوق‌یار — Docker Compose
# اجرا: docker compose -f docker-compose.sandooghyar.yml up
# سرویس‌ها: API + PostgreSQL (TimescaleDB) + Redis (کش/صف/rate-limit)

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: sandooghyar
      POSTGRES_PASSWORD: sandooghyar_dev
      POSTGRES_DB: sandooghyar
    ports:
      - "5433:5432"
    volumes:
      - sandooghyar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandooghyar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn apps.funds.main:app --host 0.0.0.0 --port 8000
    environment:
      SANDOOGHYAR_DB_URL: postgresql+psycopg://sandooghyar:sandooghyar_dev@db:5432/sandooghyar
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  sandooghyar_pgdata: