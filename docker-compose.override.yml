# ── Development Override ───────────────────────────────
# Automatically loaded by `docker compose up`.
# Adds hot-reload and source mounts for the services we iterate on.
#
# Every service listed here MUST exist in docker-compose.yml. An override entry
# with neither `image` nor `build` makes the whole project invalid, so the
# previous `api` / `admin` / `scheduler` / `postgres` stanzas — which belong to
# docker-compose.production.yml — are gone (audit DEP-01: `docker compose config`
# failed with `service "scheduler" has neither an image nor a build context`).
# Ports stay in the base file; repeating them here appends duplicate mappings.

services:
  backend:
    volumes:
      - .:/app
    command: uvicorn apps.api.app:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      API_URL: http://backend:8000
      API_PREFIX: /api/v1
      NODE_ENV: development
    command: npx next dev --webpack -p 3000

  worker:
    volumes:
      - .:/app

  ingestion:
    volumes:
      - .:/app
