# ── Development Override ───────────────────────────────
# Automatically loaded by `docker compose up`.
# Adds hot-reload, volume mounts, and relaxed settings.

services:
  api:
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn apps.api.app:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      API_URL: http://api:8000
      API_PREFIX: /api/v1
      NODE_ENV: development
    command: npx next dev --webpack -p 3000
    depends_on:
      - api

  admin:
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    command: uvicorn apps.admin.app:admin_app --host 0.0.0.0 --port 8001 --reload

  worker:
    volumes:
      - .:/app

  scheduler:
    command: ["python", "-m", "apps.scheduler"]
    volumes:
      - .:/app

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
