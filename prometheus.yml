global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ingestion"
    static_configs:
      - targets: ["ingestion:8000"]
    metrics_path: /metrics
  # API metrics (apps/api/app.py → GET /metrics).
  # Production compose names the service ``api``; the dev compose names it
  # ``backend``. Scrape whichever name resolves on your Prometheus network
  # (or go through nginx, which already proxies ``/metrics`` to the backend).
  - job_name: "api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
