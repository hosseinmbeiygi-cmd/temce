# ── Decision Engine Deployment ───────────────────────────────────
# Kubernetes Deployment for the Decision Engine microservice.
#
# Apply:
#   kubectl apply -f k8s/decision-engine-configmap.yaml
#   kubectl apply -f k8s/decision-engine-secret.yaml
#   kubectl apply -f k8s/decision-engine-deployment.yaml
#
# Scale:
#   kubectl scale deployment decision-engine --replicas=3
#
# Rollout:
#   kubectl set image deployment/decision-engine decision-engine=ghcr.io/org/decision-engine:v2
#   kubectl rollout status deployment/decision-engine
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-engine
  namespace: default
  labels:
    app: decision-engine
    component: api
    version: enterprise-1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: decision-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: decision-engine
        component: api
        version: enterprise-1.0
    spec:
      # ── Init container: wait for PostgreSQL ──
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 "${DATABASE_HOST}" "${DATABASE_PORT}"; do
                echo "Waiting for PostgreSQL at ${DATABASE_HOST}:${DATABASE_PORT}..."
                sleep 3
              done
              echo "PostgreSQL is ready!"
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: decision-engine-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: decision-engine-config
                  key: DATABASE_PORT

      # ── Main container ──
      containers:
        - name: decision-engine
          image: ghcr.io/iran-market-platform/decision-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP

          # ── Environment from ConfigMap + Secret ──
          env:
            # From ConfigMap
            - name: DECISION_ENGINE_PORT
              valueFrom:
                configMapKeyRef:
                  name: decision-engine-config
                  key: DECISION_ENGINE_PORT
            - name: API_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: decision-engine-config
                  key: API_PREFIX
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: decision-engine-config
                  key: APP_NAME
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: decision-engine-config
                  key: LOG_LEVEL
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: decision-engine-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: decision-engine-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: decision-engine-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: decision-engine-config
                  key: DATABASE_USER
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: decision-engine-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: decision-engine-config
                  key: REDIS_PORT
            - name: SENTRY_DSN
              valueFrom:
                configMapKeyRef:
                  name: decision-engine-config
                  key: SENTRY_DSN
            - name: SENTRY_TRACES_SAMPLE_RATE
              valueFrom:
                configMapKeyRef:
                  name: decision-engine-config
                  key: SENTRY_TRACES_SAMPLE_RATE

            # From Secret
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: decision-engine-secret
                  key: DATABASE_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: decision-engine-secret
                  key: REDIS_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: decision-engine-secret
                  key: SECRET_KEY

            # ── Computed URLs ──
            - name: DATABASE_URL
              value: "postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
            - name: DATABASE_URL_ASYNC
              value: "postgresql+asyncpg://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0"

          # ── Health Checks ──
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1

          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          # ── Resource Limits ──
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"

          # ── Volume Mounts ──
          volumeMounts:
            - name: logs
              mountPath: /app/logs

      # ── Volumes ──
      volumes:
        - name: logs
          emptyDir: {}

      # ── Pod configuration ──
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
