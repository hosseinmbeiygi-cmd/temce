# ── Decision Engine Secret ────────────────────────────────────────
# Sensitive configuration (base64 encoded).
# Apply with: kubectl apply -f k8s/decision-engine-secret.yaml
#
# Generate encoded values:
#   echo -n "your-password" | base64 -w0
#   echo -n "your-redis-pass" | base64 -w0
apiVersion: v1
kind: Secret
metadata:
  name: decision-engine-secret
  namespace: default
  labels:
    app: decision-engine
    component: secret
type: Opaque
data:
  # ⚠️ These are EXAMPLE values. Replace before production use.
  # echo -n "decision_pass_456" | base64 -w0
  DATABASE_PASSWORD: ZGVjaXNpb25fcGFzc180NTY=

  # echo -n "de_redis_pass_789" | base64 -w0
  REDIS_PASSWORD: ZGVfcmVkaXNfcGFzc183ODk=

  # echo -n "replace-with-a-secure-random-key-32-chars" | base64 -w0
  SECRET_KEY: cmVwbGFjZS13aXRoLWEtc2VjdXJlLXJhbmRvbS1rZXktMzItY2hhcnM=
