# Canonical symbol registry — single source of truth for gold/FX
# برای جلوگیری از باگ واحد (ریال/تومان) و نام پراکنده نماد
symbols:
  gold_18k:
    source_symbol: "gold_18k"
    source: "brsapi"
    asset_type: "local_gold"
    currency: "IRR"
