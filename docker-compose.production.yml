x-app-prod: &app-prod
  env_file: .env.production
  restart: always
  networks:
    - internal
    - observability
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "5"
  secrets:
    - postgres_password
    - secret_key
    - api_key
  # Sentry reads SENTRY_DSN from .env.production (see .env.example); the
  # explicit mapping also lets Swarm-only env injection override it:
  #   docker stack deploy ... (env comes from env_file above)
  environment:
    # CFG-01: must be set so validate_production() fires its 7 security gates
    # and settings.is_production=True enables fail-closed guards throughout.
    ENV: production
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    GOLD_API_TOKEN_SALT: ${GOLD_API_TOKEN_SALT:?GOLD_API_TOKEN_SALT must be set}
    # SEC-08b: disable public self-registration in production; admin creates
    # users from the management panel. Set REGISTRATION_OPEN=true to re-enable.
    REGISTRATION_OPEN: "false"
    # EX-13: each API replica must NOT start the APScheduler job engine; the
    # dedicated 'scheduler' service (Dockerfile.scheduler) owns all job triggers.
    # Without this flag every API replica and the scheduler each fire the same
    # 29+ jobs, multiplying every trigger by (replica_count + 1).
    DISABLE_SCHEDULER_IN_API: "1"
    # JOB-01: queue must be enabled in production so the 2 worker replicas
    # actually process jobs via BRPOP and all queue guarantees (dedup, retry,
    # dead-letter, semaphore) are active.  JOB_QUEUE_TOKEN is required via
    # validate_production() gate added alongside this fix.
    JOB_QUEUE_ENABLED: "true"
    JOB_QUEUE_TOKEN: ${JOB_QUEUE_TOKEN:?JOB_QUEUE_TOKEN must be set for production queue auth}

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  secret_key:
    file: ./secrets/secret_key.txt
  api_key:
    file: ./secrets/api_key.txt

services:
  api:
    <<: *app-prod
    image: ghcr.io/${REPOSITORY:-iran-market-platform}/api:${VERSION:-latest}
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.5"
          memory: "256M"
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
    healthcheck:
      # CFG-07: use /ready (503 when DB/Redis unavailable) not /health (always 200)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  admin:
    <<: *app-prod
    image: ghcr.io/${REPOSITORY:-iran-market-platform}/admin:${VERSION:-latest}
    ports:
      - "127.0.0.1:8001:8001"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  worker:
    <<: *app-prod
    image: ghcr.io/${REPOSITORY:-iran-market-platform}/worker:${VERSION:-latest}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: "1G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  scheduler:
    <<: *app-prod
    image: ghcr.io/${REPOSITORY:-iran-market-platform}/scheduler:${VERSION:-latest}
    # Note: depends_on intentionally omitted — this file is used with
    # 'docker stack deploy' (Swarm) which ignores depends_on.
    # Startup ordering handled by application-level retry logic.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  redis:
    image: redis:7.2-alpine
    restart: always
    networks:
      - internal
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  postgres:
    image: timescale/timescaledb:2.16-pg15
    restart: always
    networks:
      - internal
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
        reservations:
          cpus: "0.5"
          memory: "512M"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Reverse proxy / TLS termination ──────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/nginx/logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: ghcr.io/${REPOSITORY:-iran-market-platform}/frontend:${VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # UIF-01: NEXT_PUBLIC_* vars are inlined at build time; pass them as
      # build-args here so the production image uses production values.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_APP_VERSION: ${VERSION:-latest}
    restart: always
    environment:
      # UIF-14: NEXT_PUBLIC_* runtime env vars have NO EFFECT — Next.js inlines
      # them into the client bundle at `npm run build`.  Set them in `build.args`
      # above, not here.  The runtime var is intentionally removed to prevent the
      # false impression that it configures the deployed frontend.
      # Server-side Sentry (instrumentation.ts). Browser-side vars must be
      # inlined at build time (build args) — see frontend/.env.sentry.example.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

networks:
  internal:
    driver: overlay
  observability:
    external: true

volumes:
  postgres_data:
    driver: cloudstor:aws
  redis_data:
