version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: tse_timescaledb
    environment:
      - POSTGRES_DB=tse_quant
      - POSTGRES_USER=quant_dev
      - POSTGRES_PASSWORD=securepassword123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant_dev -d tse_quant"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7.0-alpine
    container_name: tse_redis
    command: redis-server --appendonly yes --requirepass redissecure456
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tse_backend
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://quant_dev:securepassword123@timescaledb:5432/tse_quant
      - REDIS_URL=redis://:redissecure456@redis:6379/0
      # Scheduler inside the API: in multi-replica deployments enable queue
      # mode so jobs are pushed to Redis instead of running in every replica.
      - JOB_QUEUE_ENABLED=true
      - JOB_QUEUE_TOKEN=dev-shared-queue-token
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: tse_worker
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://quant_dev:securepassword123@timescaledb:5432/tse_quant
      - REDIS_URL=redis://:redissecure456@redis:6379/0
      - JOB_QUEUE_ENABLED=true
      - JOB_QUEUE_TOKEN=dev-shared-queue-token
    volumes:
      - ./logs:/app/logs
    restart: always
    # Scale to N replicas with:  docker compose up --scale worker=N
    deploy:
      replicas: 1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tse_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    restart: always

volumes:
  pgdata:
  redisdata:
