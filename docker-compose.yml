version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: tse_timescaledb
    environment:
      - POSTGRES_DB=tse_quant
      - POSTGRES_USER=quant_dev
      # Dev-only default; override with .env or your shell. The previous
      # hardcoded value (securepassword123) had leaked via the git history.
      - POSTGRES_PASSWORD=${DEV_POSTGRES_PASSWORD:-qT7vR2mXe9LpZ4kD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant_dev -d tse_quant"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7.0-alpine
    container_name: tse_redis
    # Dev-only default; override with .env or your shell (leaked in history).
    command: redis-server --appendonly yes --requirepass ${DEV_REDIS_PASSWORD:-rD8wN5sYh2JqX6vB}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tse_backend
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://quant_dev:${DEV_POSTGRES_PASSWORD:-qT7vR2mXe9LpZ4kD}@timescaledb:5432/tse_quant
      - REDIS_URL=redis://:${DEV_REDIS_PASSWORD:-rD8wN5sYh2JqX6vB}@redis:6379/0
      # Scheduler inside the API: in multi-replica deployments enable queue
      # mode so jobs are pushed to Redis instead of running in every replica.
      - JOB_QUEUE_ENABLED=true
      - JOB_QUEUE_TOKEN=${DEV_JOB_QUEUE_TOKEN:-jK3nQ8vTz5WmR7xC}
      # Optional error tracking — unset/empty keeps the app Sentry-free.
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: tse_worker
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://quant_dev:${DEV_POSTGRES_PASSWORD:-qT7vR2mXe9LpZ4kD}@timescaledb:5432/tse_quant
      - REDIS_URL=redis://:${DEV_REDIS_PASSWORD:-rD8wN5sYh2JqX6vB}@redis:6379/0
      - JOB_QUEUE_ENABLED=true
      - JOB_QUEUE_TOKEN=${DEV_JOB_QUEUE_TOKEN:-jK3nQ8vTz5WmR7xC}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    volumes:
      - ./logs:/app/logs
    restart: always
    # Scale to N replicas with:  docker compose up --scale worker=N
    deploy:
      replicas: 1

  currency:
    build:
      context: .
      dockerfile: Dockerfile.currency
    container_name: tse_currency
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://quant_dev:${DEV_POSTGRES_PASSWORD:-qT7vR2mXe9LpZ4kD}@timescaledb:5432/tse_quant
      - REDIS_URL=redis://:${DEV_REDIS_PASSWORD:-rD8wN5sYh2JqX6vB}@redis:6379/0
      # Live Tgju/Nobitex rates (per-venue fixture fallback on failure):
      - CURRENCY_USE_LIVE=true
      - SENTRY_DSN=${SENTRY_DSN:-}
    ports:
      - "8002:8002"
    volumes:
      - ./logs:/app/logs
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tse_frontend
    depends_on:
      - backend
      - currency
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - CURRENCY_API_URL=http://currency:8002
      # Optional error tracking — unset/empty ships the bundle Sentry-free.
      # NOTE: NEXT_PUBLIC_* vars are inlined at BUILD time; for the browser
      # SDK pass them as build args in Dockerfile.frontend, or rely on the
      # server/runtime init alone.
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    restart: always

volumes:
  pgdata:
  redisdata:
